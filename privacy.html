    <script>
        function toggleMaintenanceBanner() {
            var banner = document.getElementById('maintenanceBanner');
            if (!banner) return;
            var isHidden = banner.classList.contains('hidden');
            if (isHidden) {
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }
        }
    </script>
