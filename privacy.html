<!DOCTYPE html>
<html lang="en" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=/privacy/">
    <script>window.location.replace('/privacy/');</script>
    <title>Redirecting to Privacy Policy...</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/assets/Image/hamzabellouch.jpg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/Image/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/Image/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/Image/hamzabellouch.jpg">
</head>
<body>
    <p>Redirecting to <a href="/privacy/">Privacy Policy</a>...</p>
    <script>
        (function() {
            var _timer = null;
            window.toggleMaintenanceBanner = function() {
                var banner = document.getElementById('maintenanceBanner');
                var countdown = document.getElementById('maintenanceCountdown');
                var ring = document.getElementById('maintenanceRing');
                if (!banner) return;

                // If already visible → hide and cancel timer
                if (!banner.classList.contains('hidden')) {
                    if (_timer) { clearInterval(_timer); _timer = null; }
                    banner.classList.add('hidden');
                    return;
                }

                // Show banner, reset countdown to 5
                banner.classList.remove('hidden');
                var timeLeft = 5;
                var CIRCUMFERENCE = 100;
                if (countdown) countdown.textContent = timeLeft;
                if (ring) ring.style.strokeDasharray = CIRCUMFERENCE + ' ' + CIRCUMFERENCE;

                if (_timer) { clearInterval(_timer); _timer = null; }
                _timer = setInterval(function() {
                    timeLeft--;
                    var fraction = timeLeft / 5;
                    if (countdown) countdown.textContent = timeLeft;
                    if (ring) ring.style.strokeDasharray = (CIRCUMFERENCE * fraction) + ' ' + CIRCUMFERENCE;
                    if (timeLeft <= 0) {
                        clearInterval(_timer); _timer = null;
                        banner.classList.add('hidden');
                    }
                }, 1000);
            };
        })();
    </script>
</body>
</html>
